const SALT = "e0m6rY94Ztm9PxBoUYgRMQ==";
const IV = "ntohSgqzmjuniD4v";
const ITER = 200000;

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const btn = document.getElementById('go');
const pw = document.getElementById('pw');

async function unlock() {
  const pass = pw.value;
  if (!pass) { msg.textContent = '請輸入密碼'; return; }
  btn.disabled = true; msg.style.color = '#888'; msg.textContent = '解密中…';
  try {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(PAYLOAD));
    render(new TextDecoder().decode(plain));
  } catch (e) {
    btn.disabled = false;
    msg.style.color = '#dd4b39';
    msg.textContent = '密碼不對，再試一次';
  }
}

function render(html) {
  document.getElementById('lock').remove();
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  // 解密成功才換上真正的標題，鎖定畫面永遠只顯示中性字樣
  const t = tpl.content.querySelector('title');
  if (t) { document.title = t.textContent; t.remove(); }
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  // 先放版面與樣式，再依序執行腳本（innerHTML 塞進去的 script 不會自己跑）
  document.body.appendChild(tpl.content);
  scripts.forEach(old => {
    const s = document.createElement('script');
    s.textContent = old.textContent;
    document.body.appendChild(s);
  });
}

btn.addEventListener('click', unlock);
pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
