const SALT = "AOLEPA9K+1eb/bc5qogkOg==";
const IV = "sGHzQdgeRdLpRd1i";
const ITER = 200000;
const REMEMBER = 'dn-unlock';   // 記住解鎖狀態的鍵名

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg');
const btn = document.getElementById('go');
const pw = document.getElementById('pw');
const lock = document.getElementById('lock');
const boot = document.getElementById('boot');

const remembered = () => { try { return localStorage.getItem(REMEMBER); } catch { return null; } };
const forget = () => { try { localStorage.removeItem(REMEMBER); } catch {} };

function showLock(text) {
  boot.remove();
  lock.classList.add('show');
  if (text) { msg.style.color = '#dd4b39'; msg.textContent = text; }
  pw.focus();
}

async function decrypt(pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass),
    'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: b64(SALT), iterations: ITER, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(IV) }, key, b64(PAYLOAD));
  return new TextDecoder().decode(plain);
}

// silent = 用記住的密碼自動解鎖，失敗就安靜地退回輸入畫面（例如密碼換過了）
async function unlock(pass, silent) {
  if (!pass) { showLock('請輸入密碼'); return; }
  if (!silent) { btn.disabled = true; msg.style.color = '#888'; msg.textContent = '解密中…'; }
  try {
    const html = await decrypt(pass);
    try { localStorage.setItem(REMEMBER, pass); } catch {}
    render(html);
  } catch (e) {
    if (silent) { forget(); showLock(); }
    else { btn.disabled = false; msg.style.color = '#dd4b39'; msg.textContent = '密碼不對，再試一次'; }
  }
}

function render(html) {
  boot.remove();
  lock.remove();
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  // 解密成功才換上真正的標題，鎖定畫面永遠只顯示中性字樣
  const t = tpl.content.querySelector('title');
  if (t) { document.title = t.textContent; t.remove(); }
  const scripts = [...tpl.content.querySelectorAll('script')];
  scripts.forEach(s => s.remove());
  // 先放版面與樣式，再依序執行腳本（innerHTML 塞進去的 script 不會自己跑）
  document.body.appendChild(tpl.content);
  scripts.forEach(old => {
    const s = document.createElement('script');
    s.textContent = old.textContent;
    document.body.appendChild(s);
  });
  addLockButton();
}

// 頂欄放一個鎖頭：按了就忘掉這台裝置記住的密碼
function addLockButton() {
  const right = document.querySelector('#topbar .right');
  if (!right) return;
  const b = document.createElement('span');
  b.id = 'lockbtn';
  b.textContent = '🔒';
  b.title = '鎖定（清除這台裝置記住的密碼）';
  b.addEventListener('click', () => { forget(); location.reload(); });
  right.insertBefore(b, right.firstChild);
}

btn.addEventListener('click', () => unlock(pw.value, false));
pw.addEventListener('keydown', e => { if (e.key === 'Enter') unlock(pw.value, false); });

// 進站：記得住就直接開，記不住才問密碼
const saved = remembered();
if (saved) unlock(saved, true); else showLock();
</script>
